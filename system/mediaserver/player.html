<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>comma four videos</title>
<style>
  :root { --bg: #0b0b0c; --panel: #17171a; --text: #f2f2f2; --dim: #9a9aa0; --accent: #33c26b; --line: #2a2a2f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  video { display: block; width: 100%; max-height: 56vh; background: #000; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; }
  .bar .now { flex: 1 1 100%; color: var(--dim); font-size: 13px; }
  button, a.btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px;
    padding: 6px 10px; font-size: 13px; text-decoration: none; }
  button.on { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.35; }
  #msg { padding: 10px 12px; color: var(--dim); }
  #msg.error { color: #ff6b6b; }
  .route { padding: 12px 0 4px; border-bottom: 1px solid var(--line); }
  .route h2 { margin: 0 12px 8px; font-size: 15px; font-weight: 600; }
  .route h2 span { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 10px; scroll-snap-type: x proximity; }
  .thumb { flex: 0 0 auto; width: 132px; scroll-snap-align: start; cursor: pointer; }
  .thumb img, .thumb .ph { display: block; width: 132px; height: 83px; object-fit: cover; border-radius: 6px; background: var(--panel); border: 2px solid transparent; }
  .thumb.playing img, .thumb.playing .ph { border-color: var(--accent); }
  .thumb div.t { color: var(--dim); font-size: 12px; margin-top: 3px; }
</style>
</head>
<body>
<header>
  <video id="video" controls playsinline></video>
  <div class="bar">
    <div class="now" id="now">サムネイルをタップすると再生します</div>
    <button data-cam="qcamera">標準</button>
    <button data-cam="fcamera">高画質</button>
    <button data-cam="ecamera">広角</button>
    <button data-cam="dcamera">車内</button>
    <a class="btn" id="download" href="#">保存</a>
  </div>
</header>
<div id="msg">読み込み中…</div>
<main id="routes"></main>

<script>
const HEARTBEAT_MS = 30000;
const video = document.getElementById('video');
const msg = document.getElementById('msg');
let routes = [];
let current = null;  // {route, index}
let camera = 'qcamera';

function pad(n) { return String(n).padStart(2, '0'); }
function clock(t) { const d = new Date(t * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function day(t) { const d = new Date(t * 1000); return `${d.getMonth() + 1}月${d.getDate()}日`; }
function segmentLabel(route, seg) {
  return route.start ? clock(route.start + seg.num * 60) : `${seg.num}分目`;
}
function showError(text) { msg.textContent = text; msg.className = 'error'; msg.hidden = false; }

async function load() {
  try {
    const res = await fetch('/api/routes');
    routes = await res.json();
  } catch (e) {
    showError('comma four に接続できません。停車中に「share videos」をオンにしてください。');
    return;
  }
  msg.hidden = routes.length > 0;
  msg.textContent = '動画がありません';
  const list = document.getElementById('routes');
  list.innerHTML = '';
  routes.forEach((route, r) => {
    const el = document.createElement('section');
    el.className = 'route';
    const h2 = document.createElement('h2');
    h2.textContent = route.start ? `${day(route.start)} ${clock(route.start)}` : route.name;
    const length = document.createElement('span');
    length.textContent = `${route.segments.length}分`;
    h2.append(length);
    const thumbs = document.createElement('div');
    thumbs.className = 'thumbs';
    el.append(h2, thumbs);
    route.segments.forEach((seg, i) => {
      const t = document.createElement('div');
      t.className = 'thumb';
      t.dataset.segment = seg.name;
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = `/api/thumb/${seg.name}.jpg`;
      img.onerror = () => { const ph = document.createElement('div'); ph.className = 'ph'; img.replaceWith(ph); };
      const label = document.createElement('div');
      label.className = 't';
      label.textContent = segmentLabel(route, seg);
      t.append(img, label);
      t.onclick = () => play(r, i);
      thumbs.append(t);
    });
    list.append(el);
  });
}

function segmentAt(pos) { return routes[pos.route].segments[pos.index]; }

function play(r, i) {
  current = {route: r, index: i};
  const seg = segmentAt(current);
  if (!seg.cameras.includes(camera)) camera = 'qcamera';
  video.src = `/video/${seg.name}/${camera}.mp4`;
  video.play().catch(() => {});
  document.getElementById('download').href = `/video/${seg.name}/${camera}.mp4?dl=1`;
  document.getElementById('now').textContent = `再生中: ${segmentLabel(routes[r], seg)}${camera === 'qcamera' ? '' : '(変換に数秒かかります)'}`;
  document.querySelectorAll('.thumb').forEach(t => t.classList.toggle('playing', t.dataset.segment === seg.name));
  document.querySelector('.thumb.playing')?.scrollIntoView({block: 'nearest', inline: 'center'});
  updateButtons();
}

function updateButtons() {
  const cams = current ? segmentAt(current).cameras : [];
  document.querySelectorAll('button[data-cam]').forEach(b => {
    b.classList.toggle('on', b.dataset.cam === camera);
    b.disabled = !cams.includes(b.dataset.cam);
    b.hidden = b.dataset.cam === 'dcamera' && !cams.includes('dcamera');
  });
}

document.querySelectorAll('button[data-cam]').forEach(b => b.onclick = () => {
  camera = b.dataset.cam;
  if (current) play(current.route, current.index);
});

// continue with the next segment of the route
video.addEventListener('ended', () => {
  if (current && current.index + 1 < routes[current.route].segments.length) play(current.route, current.index + 1);
});
video.addEventListener('error', () => {
  if (current) document.getElementById('now').textContent = 'この動画を再生できませんでした。「保存」でダウンロードできます。';
});

// keep the server running while a video plays, it stops after a while without requests
setInterval(() => {
  if (!video.paused && !video.ended && document.visibilityState === 'visible') {
    fetch('/api/alive', {method: 'POST'}).catch(() => showError('comma four との接続が切れました。'));
  }
}, HEARTBEAT_MS);

updateButtons();
load();
</script>
</body>
</html>
